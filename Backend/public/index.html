<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Auth</title>
    <link rel="stylesheet" href="css/user.css">
</head>
<body>

<h1>Test Authentification</h1>

<section>
    <h2>Inscription</h2>
    <form id="form-inscription">
        <input type="email" id="inscription-email" placeholder="Email" required>
        <input type="password" id="inscription-password" placeholder="Mot de passe" required>
        <button type="submit">S'inscrire</button>
    </form>
    <p id="inscription-message"></p>
</section>

<hr>

<section>
    <h2>Connexion</h2>
    <form id="form-connexion">
        <input type="email" id="connexion-email" placeholder="Email" required>
        <input type="password" id="connexion-password" placeholder="Mot de passe" required>
        <button type="submit">Se connecter</button>
    </form>
    <p id="connexion-message"></p>
</section>

<hr>

<section>
    <h2>Déconnexion</h2>
    <button id="btn-deconnexion">Se déconnecter</button>
    <p id="deconnexion-message"></p>
</section>

<script type="module" src="/js/validation.js"></script>
<script type="module" src="/js/connexion.js"></script>
<script type="module" src="/js/deconnexion.js"></script>
<script type="module" src="/js/home.js"></script>

</body>
</html>
