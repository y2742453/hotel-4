name: Tests backend

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: admin
          MYSQL_DATABASE: HotelDB_Test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
        working-directory: Backend
      - run: sudo apt-get install -y mysql-client
      - run: |
          until mysql -h 127.0.0.1 -u root -padmin -e "SHOW DATABASES;"; do 
              sleep 5 
          done
      - run: |
          mysql -h 127.0.0.1 -u root -padmin < Backend/tests/HotelDB_Test.sql
      - run: npm test
        working-directory: Backend
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: admin
          DB_NAME: HotelDB_Test
